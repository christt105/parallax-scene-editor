<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parallax Scene Editor</title>
<meta name="description" content="Editor en el navegador para escenas de parallax en pixel art que cierran en bucle. Sin servidor, sin subir nada.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2314161c'/><rect x='1' y='9' width='14' height='2' fill='%237fd4a0'/><rect x='2' y='12' width='12' height='2' fill='%23f0b45e'/><rect x='6' y='4' width='4' height='4' fill='%23e6e9ef'/></svg>">
<link rel="stylesheet" href="app.css">
</head>
<body>

<header id="toolbar">
  <div class="brand">
    <span class="mark" aria-hidden="true"></span>
    <span class="name">Parallax Scene Editor</span>
  </div>

  <div class="group">
    <button id="btn-project" class="primary" title="Abrir una carpeta del disco">Abrir carpeta…</button>
    <button id="btn-drop" class="ghost" title="Cargar archivos sueltos">Archivos…</button>
    <span id="project-label" class="pill" hidden></span>
  </div>

  <div class="group">
    <input id="scene-name" class="scene-name" value="scene" spellcheck="false"
           title="Nombre del archivo de escena">
    <button id="btn-save" title="Guardar en la carpeta (Ctrl+S)">Guardar</button>
    <button id="btn-open-scene" title="Abrir una escena del proyecto">Abrir…</button>
    <button id="btn-new" class="ghost" title="Escena vacía">Nueva</button>
  </div>

  <div class="group">
    <button id="btn-undo" class="icon" title="Deshacer (Ctrl+Z)">↶</button>
    <button id="btn-redo" class="icon" title="Rehacer (Ctrl+Shift+Z)">↷</button>
  </div>

  <div class="group right">
    <button id="btn-json" class="ghost" title="Ver y editar el JSON">JSON</button>
    <button id="btn-export" class="accent" title="Exportar GIF, WebM o PNG">Exportar…</button>
    <button id="btn-help" class="icon ghost" title="Atajos y ayuda">?</button>
  </div>
</header>

<main>
  <aside id="left">
    <section class="panel">
      <div class="panel-head">
        <h2>Escena</h2>
        <button id="btn-scene-props" class="link">propiedades</button>
      </div>
      <ul id="outliner-layers" class="outliner"></ul>
      <div class="panel-head sub">
        <h2>Actores</h2>
      </div>
      <ul id="outliner-actors" class="outliner"></ul>
    </section>

    <section class="panel grow">
      <div class="panel-head">
        <h2>Assets</h2>
        <button id="btn-refresh-assets" class="link" title="Volver a leer los archivos del disco">recargar</button>
      </div>
      <input id="asset-filter" type="search" placeholder="filtrar…" spellcheck="false">
      <p class="note" id="asset-count" hidden></p>
      <div id="asset-list" class="assets"></div>
      <p class="note" id="asset-empty">
        Abre una carpeta para usar tus propios sprites, o arrastra archivos aquí.
      </p>
    </section>
  </aside>

  <section id="center">
    <div id="stage"></div>

    <div id="transport">
      <button id="btn-play" class="icon" title="Reproducir / pausa (espacio)">⏵</button>
      <button id="btn-prev" class="icon" title="Fotograma anterior (←)">⟨</button>
      <button id="btn-next" class="icon" title="Fotograma siguiente (→)">⟩</button>
      <input id="scrub" type="range" min="0" value="0" step="1">
      <span id="frame-label" class="mono"></span>
      <label class="chk" title="Rejilla de 8 px (G)"><input type="checkbox" id="chk-grid"> rejilla</label>
      <label class="chk" title="Papel cebolla (O)"><input type="checkbox" id="chk-onion"> cebolla</label>
      <label class="chk" title="Línea del suelo"><input type="checkbox" id="chk-guides" checked> guías</label>
    </div>

    <div id="timeline"></div>
    <div id="status"></div>
  </section>

  <aside id="right"></aside>
</main>

<div id="drop-veil" hidden><span>Suelta la carpeta o los archivos</span></div>
<div id="asset-preview" hidden></div>

<dialog id="modal">
  <div class="modal-head">
    <h2 id="modal-title"></h2>
    <button class="icon ghost" id="modal-close" title="Cerrar (Esc)">×</button>
  </div>
  <div id="modal-body"></div>
</dialog>

<input id="file-input" type="file" multiple accept="image/*,.json" hidden>

<script type="module" src="src/main.js"></script>
</body>
</html>
